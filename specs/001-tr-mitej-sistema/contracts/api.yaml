openapi: 3.0.3
info:
  title: TrâmiteJá API
  description: Sistema Digital de Defesa Prévia - API gratuita e pública para gestão completa do processo de defesa de multas de trânsito
  version: 2.0.0
  contact:
    name: TrâmiteJá Support
    email: suporte@tramiteja.com.br

servers:
  - url: https://api.tramiteja.com.br/v1
    description: Production server
  - url: https://staging-api.tramiteja.com.br/v1
    description: Staging server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # === PROCESSO ENDPOINTS ===
  /processos:
    post:
      summary: Criar novo processo de defesa (gratuito)
      tags: [Processos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo_infracao, cidadao_id]
              properties:
                tipo_infracao:
                  type: string
                  enum: [velocidade, rodizio, semaforo]
                cidadao_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Processo criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Processo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      summary: Listar processos (para dashboards)
      tags: [Processos]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [rascunho, triagem, distribuido, em_analise, em_votacao, decidido, rejeitado]
        - name: relator_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de processos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Processo'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /processos/{id}:
    get:
      summary: Obter detalhes do processo
      tags: [Processos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do processo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessoDetalhado'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Atualizar processo (status, parecer, etc.)
      tags: [Processos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [triagem, distribuido, em_analise, em_votacao, decidido, rejeitado]
                parecer_relator:
                  type: string
                justificativa_rejeicao:
                  type: string
                relator_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Processo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Processo'

  # === ACOMPANHAMENTO PÚBLICO ===
  /acompanhamento/{codigo}:
    get:
      summary: Acompanhar processo por código (sem autenticação)
      tags: [Público]
      security: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9]{12}$'
      responses:
        '200':
          description: Timeline do processo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineProcesso'
        '404':
          $ref: '#/components/responses/NotFound'

  # === DOCUMENTOS ===
  /processos/{processo_id}/documentos:
    post:
      summary: Upload de documento
      tags: [Documentos]
      parameters:
        - name: processo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, tipo]
              properties:
                arquivo:
                  type: string
                  format: binary
                tipo:
                  type: string
                  enum: [cnh, crlv, comprovante, outros]
      responses:
        '201':
          description: Documento uploaded com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documento'

    get:
      summary: Listar documentos do processo
      tags: [Documentos]
      parameters:
        - name: processo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Documento'

  # === VOTAÇÃO ===
  /processos/{processo_id}/votos:
    post:
      summary: Registrar voto do julgador
      tags: [Votação]
      parameters:
        - name: processo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisao, julgador_id]
              properties:
                decisao:
                  type: string
                  enum: [concordo, discordo]
                justificativa:
                  type: string
                julgador_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Voto registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voto'

    get:
      summary: Obter votos do processo
      tags: [Votação]
      parameters:
        - name: processo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de votos
          content:
            application/json:
              schema:
                type: object
                properties:
                  votos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Voto'
                  quorum_atingido:
                    type: boolean
                  resultado:
                    type: string
                    enum: [deferido, indeferido, pendente]

  # === DASHBOARD GERENCIAL ===
  /dashboard/metricas:
    get:
      summary: Métricas em tempo real
      tags: [Dashboard]
      responses:
        '200':
          description: Métricas do sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metricas'

  # === RELATORES ===
  /relatores:
    get:
      summary: Listar relatores disponíveis
      tags: [Relatores]
      responses:
        '200':
          description: Lista de relatores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relator'

  /relatores/{id}/dashboard:
    get:
      summary: Dashboard do relator
      tags: [Relatores]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dashboard com processos pendentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  processos_pendentes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Processo'
                  estatisticas:
                    type: object

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Processo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo_acompanhamento:
          type: string
          pattern: '^[A-Z0-9]{12}$'
        tipo_infracao:
          type: string
          enum: [velocidade, rodizio, semaforo]
        status:
          type: string
          enum: [rascunho, triagem, distribuido, em_analise, em_votacao, decidido, rejeitado]
        cidadao_id:
          type: string
          format: uuid
        relator_id:
          type: string
          format: uuid
          nullable: true
        data_criacao:
          type: string
          format: date-time
        data_limite:
          type: string
          format: date-time
        data_decisao:
          type: string
          format: date-time
          nullable: true
        decisao_final:
          type: string
          enum: [deferido, indeferido]
          nullable: true

    ProcessoDetalhado:
      allOf:
        - $ref: '#/components/schemas/Processo'
        - type: object
          properties:
            parecer_relator:
              type: string
              nullable: true
            justificativa_rejeicao:
              type: string
              nullable: true
            documentos:
              type: array
              items:
                $ref: '#/components/schemas/Documento'
            votos:
              type: array
              items:
                $ref: '#/components/schemas/Voto'

    TimelineProcesso:
      type: object
      properties:
        processo:
          $ref: '#/components/schemas/Processo'
        timeline:
          type: array
          items:
            type: object
            properties:
              etapa:
                type: string
              data:
                type: string
                format: date-time
              descricao:
                type: string
              concluida:
                type: boolean

    Documento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        processo_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [cnh, crlv, comprovante, outros]
        nome_arquivo:
          type: string
        url_armazenamento:
          type: string
          format: uri
        tamanho_bytes:
          type: integer
        status_validacao:
          type: string
          enum: [pendente, aprovado, rejeitado]
        data_upload:
          type: string
          format: date-time

    Voto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        processo_id:
          type: string
          format: uuid
        julgador_id:
          type: string
          format: uuid
        decisao:
          type: string
          enum: [concordo, discordo]
        justificativa:
          type: string
          nullable: true
        data_voto:
          type: string
          format: date-time

    Relator:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        registro_oab:
          type: string
        especializacoes:
          type: array
          items:
            type: string
            enum: [velocidade, rodizio, semaforo, geral]
        processos_ativos:
          type: integer
        disponivel:
          type: boolean

    Metricas:
      type: object
      properties:
        processos_hoje:
          type: integer
        processos_pendentes:
          type: integer
        tempo_medio_processamento:
          type: number
          description: Em dias
        taxa_deferimento:
          type: number
          description: Percentual (0-100)
        alertas_prazo:
          type: integer

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: array
                items:
                  type: string

    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized"
              message:
                type: string
                example: "Token de acesso inválido ou expirado"

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Not Found"
              message:
                type: string
                example: "Recurso não encontrado"